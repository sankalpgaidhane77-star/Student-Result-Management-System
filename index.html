<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="appTitle">IIT Dholkpur | Student Result Portal</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Background -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">

        <!-- Top Bar with Language Selector -->
        <div class="lang-bar">
            <div class="lang-selector">
                <i class="fa-solid fa-globe"></i>
                <select id="langSelect" onchange="setLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="mr">मराठी (Marathi)</option>
                </select>
            </div>
        </div>

        <!-- Header -->

        <div class="header">

            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <h1 data-i18n="appTitle">IIT Dolkpur</h1>

            <p data-i18n="appSubtitle">Official Student Result Management Portal</p>

        </div>

        <!-- Search Card -->

        <div class="search-card">

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-user"></i>
                    <span data-i18n="studentNameLabel">Student Name</span>
                </label>

                <input type="text" id="nameInput" data-i18n-placeholder="studentNamePlaceholder"
                    placeholder="Enter Student Name">

            </div>

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-id-card"></i>
                    <span data-i18n="rollNumberLabel">Roll Number</span>
                </label>

                <input type="number" id="rollInput" data-i18n-placeholder="rollNumberPlaceholder"
                    placeholder="101 - 160">

            </div>

            <div class="input-group">

                <label>
                    <i class="fa-solid fa-book"></i>
                    <span data-i18n="semesterLabel">Semester</span>
                </label>

                <select id="semester">

                    <option value="sem1" data-i18n="sem1">Semester 1</option>

                    <option value="sem2" data-i18n="sem2">Semester 2</option>

                </select>

            </div>

            <button id="checkBtn" onclick="checkResult()" data-i18n="checkResultBtn">

                <i class="fa-solid fa-magnifying-glass"></i>

                Check Result

            </button>

        </div>

        <!-- Loading -->

        <div id="loader" class="loader hidden">

            <div class="spinner"></div>

            <p data-i18n="fetchingResult">Fetching Student Result...</p>

        </div>

        <!-- Result -->

        <div id="result"></div>

        <!-- Footer -->

        <footer>

            <p>

                <i class="fa-solid fa-shield-halved"></i>

                <span data-i18n="examCell">IIT Dolkpur Examination Cell</span>

            </p>

            <small data-i18n="copyright">

                © 2026 Student Result Management System

            </small>

        </footer>

    </div>

    <script src="lang.js"></script>
    <script src="script.js"></script>
</body>

</html>
